name: Build Play Store (AAB, sans quota Expo)

# Construit le fichier AAB à envoyer sur Google Play, DIRECTEMENT sur la machine Linux de
# GitHub (« eas build --local ») : ne consomme PAS le quota gratuit de builds Expo.
#
# - Même configuration que les builds Expo (eas.json, profil « production » : app-bundle,
#   canal OTA « production »).
# - Même clé de signature : elle est gérée par Expo et téléchargée pendant le build
#   (le token EXPO_TOKEN suffit). Les mises à jour resteront compatibles.
# - Le numéro de version (versionCode) est augmenté automatiquement par Expo.
#
# Résultat : onglet Actions → ce build → section « Artifacts » → 237go-play-store (.zip
# contenant le fichier .aab à envoyer dans Play Console).
#
# Déclencheur : MANUEL (Actions → Build Play Store (AAB, sans quota Expo) → Run workflow).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS (production = AAB pour le Play Store, preview = APK à installer)"
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

concurrency:
  group: build-local-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android local (GitHub)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Libérer de l'espace disque (le build Android en demande beaucoup)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules/@angular /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          docker image prune --all --force || true
          df -h /

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java 17 (requis par Android/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (préinstallé sur la machine GitHub) + licences
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Installer EAS CLI + se connecter à Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Installer les dépendances (racine du monorepo)
        run: npm ci

      # Clé d'importation Google Play (SHA-1 73:8A…), stockée chiffrée dans le secret
      # ANDROID_PLAY_SIGNING. Écrite seulement le temps du build, jamais affichée ni envoyée.
      - name: Préparer la clé de signature Google Play
        if: ${{ (github.event.inputs.profile || 'production') == 'production' }}
        working-directory: apps/mobile
        env:
          PLAY_SIGNING: ${{ secrets.ANDROID_PLAY_SIGNING }}
        run: |
          if [ -z "$PLAY_SIGNING" ]; then
            echo "::error::Secret ANDROID_PLAY_SIGNING absent : le fichier serait signé avec une clé refusée par Google Play."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const s = JSON.parse(Buffer.from(process.env.PLAY_SIGNING, "base64").toString("utf8"));
            fs.mkdirSync("credentials/android", { recursive: true });
            fs.writeFileSync("credentials/android/keystore.jks", Buffer.from(s.keystore, "base64"));
            fs.writeFileSync("credentials.json", JSON.stringify({ android: { keystore: {
              keystorePath: "credentials/android/keystore.jks",
              keystorePassword: s.keystorePassword, keyAlias: s.keyAlias, keyPassword: s.keyPassword } } }));
          '
          FP=$(keytool -list -v -keystore credentials/android/keystore.jks -storepass "$(node -p 'JSON.parse(require("fs").readFileSync("credentials.json")).android.keystore.keystorePassword')" 2>/dev/null | grep -m1 'SHA1' | sed 's/.*SHA1: //')
          echo "Empreinte de la clé : $FP"
          if [ "$FP" != "73:8A:B0:D1:4D:B1:25:2C:0F:F5:96:64:B9:83:58:C5:9E:09:38:91" ]; then
            echo "::error::Ce n'est pas la clé attendue par Google Play (73:8A…)."
            exit 1
          fi

      - name: Construire (eas build --local)
        working-directory: apps/mobile
        env:
          # Gradle : assez de mémoire sans dépasser celle de la machine GitHub
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          # Play Store : profil qui signe avec la clé locale (secret) au lieu de celle d'Expo
          EAS_PROFILE="$PROFILE"; if [ "$PROFILE" = "production" ]; then EAS_PROFILE="production-play"; fi
          if [ "$PROFILE" = "production" ]; then OUT="$GITHUB_WORKSPACE/out/237go.aab"; else OUT="$GITHUB_WORKSPACE/out/237go.apk"; fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          eas build \
            --platform android \
            --profile "$EAS_PROFILE" \
            --local \
            --non-interactive \
            --output "$OUT"
          ls -lh "$GITHUB_WORKSPACE/out"
          if [ "$PROFILE" = "production" ]; then
            echo "Signature du fichier :"
            keytool -printcert -jarfile "$OUT" | grep -m1 'SHA1'
          fi

      - name: Effacer la clé de la machine GitHub
        if: always()
        working-directory: apps/mobile
        run: rm -rf credentials credentials.json

      - name: Mettre le fichier à disposition (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: 237go-play-store
          path: out/*
          retention-days: 30
          if-no-files-found: error

      - name: Où trouver le fichier
        run: |
          echo "✅ Build terminé."
          echo "Téléchargez le fichier : en haut de cette page → Summary → Artifacts → 237go-play-store"
          echo "Puis Play Console → 237GO → Production → Créer une release → importer le .aab"
