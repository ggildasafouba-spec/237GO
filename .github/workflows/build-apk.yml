name: Build APK (Android)

# Construit automatiquement un APK installable via EAS.
# Le repo est un monorepo npm workspaces : les dépendances s'installent à la
# RACINE (où vit le package-lock.json et la config workspaces), puis le build
# EAS est lancé depuis apps/mobile.
#
# Déclencheurs :
#   - à chaque push sur main qui modifie l'app mobile
#   - manuellement depuis l'onglet "Actions" (workflow_dispatch)
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS à utiliser"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  # Évite deux builds en parallèle pour le même déclencheur ; annule l'ancien.
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: EAS Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer EAS CLI + se connecter à Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # Le projet utilise npm : sans ça l'action utilise yarn par défaut et échoue.
          packager: npm

      - name: Installer les dépendances (racine du monorepo)
        # Monorepo npm workspaces : on installe depuis la racine avec le
        # package-lock.json racine pour que les workspaces se résolvent bien.
        run: npm ci

      - name: Lancer le build EAS (APK)
        # Lancé depuis apps/mobile (où vit app.json / eas.json).
        # --non-interactive : indispensable en CI (aucune question posée)
        # --no-wait : ne bloque pas le runner ; le build se poursuit côté Expo
        working-directory: apps/mobile
        run: |
          eas build \
            --platform android \
            --profile "${{ github.event.inputs.profile || 'preview' }}" \
            --non-interactive \
            --no-wait

      - name: Où trouver l'APK
        run: |
          echo "Build lancé sur EAS."
          echo "Récupérez l'APK (lien + QR code) sur :"
          echo "https://expo.dev/accounts/ggildas/projects/237go/builds"
