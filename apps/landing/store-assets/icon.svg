<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2EE066"/>
      <stop offset="1" stop-color="#1DB954"/>
    </linearGradient>
  </defs>
  <!-- Fond carré arrondi vert (icône app) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Logo officiel 237GO (reproduit du cercle de l'app, agrandi) -->
  <g transform="translate(256 256) scale(4.1) translate(-50 -50)">
    <!-- flèche jaune (mouvement) -->
    <path d="M22 62 Q50 42 74 50 L68 44 M74 50 L68 56"
          stroke="#FCD116" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="50" y="40" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">237</text>
    <text x="50" y="82" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FCD116" text-anchor="middle">GO</text>
  </g>

  <!-- Liseré drapeau Cameroun en bas (vert / rouge / jaune) -->
  <g transform="translate(136 452)">
    <rect x="0"   y="0" width="80" height="14" rx="7" fill="#007A5E"/>
    <rect x="80"  y="0" width="80" height="14" fill="#CE1126"/>
    <rect x="160" y="0" width="80" height="14" rx="7" fill="#FCD116"/>
  </g>
</svg>
