<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!-- Image de présentation Play Store 1024x500, style v2 (couleurs du Cameroun). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A5C42"/>
      <stop offset="1" stop-color="#062E22"/>
    </linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00966E"/>
      <stop offset="1" stop-color="#004D3A"/>
    </linearGradient>
    <clipPath id="sq"><rect width="400" height="400" rx="88"/></clipPath>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Icône à gauche -->
  <g transform="translate(70,100) scale(0.75)">
    <g clip-path="url(#sq)">
      <rect width="400" height="400" fill="url(#ic)"/>
      <polygon transform="translate(200,108) scale(0.24)" fill="#FCD116"
        points="0,-100 22.45,-30.9 95.1,-30.9 36.33,11.8 58.78,80.9 0,38.2 -58.78,80.9 -36.33,11.8 -95.1,-30.9 -22.45,-30.9"/>
      <text x="200" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="bold" fill="#fff">237<tspan fill="#FCD116">GO</tspan></text>
      <path d="M85 268 Q200 252 318 224" stroke="#CE1126" stroke-width="13" stroke-linecap="round" fill="none"/>
      <path d="M85 292 Q200 276 318 248" stroke="#FCD116" stroke-width="13" stroke-linecap="round" fill="none"/>
      <path d="M85 316 Q200 300 318 272" stroke="#fff" stroke-width="13" stroke-linecap="round" fill="none"/>
    </g>
    <rect width="400" height="400" rx="88" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>
  </g>

  <!-- Textes -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="420" y="205" font-size="112" fill="#fff">237<tspan fill="#FCD116">GO</tspan></text>
    <text x="424" y="268" font-size="44" fill="#fff">On bouge ensemble</text>
    <text x="424" y="314" font-size="32" fill="#FCD116">Let's move together</text>
    <text x="424" y="360" font-size="24" font-weight="normal" fill="#CFE8DD">La super-app de mobilité camerounaise</text>
  </g>

  <!-- Bande aux couleurs du drapeau -->
  <rect x="424" y="386" width="72" height="10" rx="5" fill="#00A878"/>
  <rect x="500" y="386" width="72" height="10" rx="5" fill="#CE1126"/>
  <rect x="576" y="386" width="72" height="10" rx="5" fill="#FCD116"/>
</svg>
